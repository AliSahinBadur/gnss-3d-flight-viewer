<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Flight Viewer rocket</title>
  <desc id="desc">A stylized rocket crossing a glowing orbital arc</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#8ab8f7"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a4"/>
      <stop offset=".45" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51d6c8"/>
      <stop offset="1" stop-color="#4f91ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="43" fill="#0c1725" stroke="#2c4f72" stroke-width="2"/>
  <path d="M12 61c18 19 54 20 73-2" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="15" cy="61" r="3" fill="#51d6c8"/>
  <g transform="rotate(31 50 43)">
    <path d="M50 12c-10 10-15 25-13 44h26c2-19-3-34-13-44Z" fill="url(#body)" stroke="#d9ebff" stroke-width="1.5"/>
    <circle cx="50" cy="34" r="6" fill="#14375a" stroke="#51d6c8" stroke-width="2"/>
    <path d="M37 46 27 60l12-3m24-11 10 14-12-3" fill="#4f91ff" stroke="#b8d5ff" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M43 56h14l-2 9H45Z" fill="#586f8d"/>
    <path d="m46 64 4 20 4-20Z" fill="url(#flame)" filter="url(#glow)"/>
  </g>
</svg>
